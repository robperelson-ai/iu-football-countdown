<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IU Football Countdown</title>

<style>
  body {
    margin:0;
    background:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }

  .card {
    background:white;
    padding:40px;
    border-radius:18px;
    box-shadow:0 20px 50px rgba(0,0,0,0.12);
    text-align:center;
    width:700px;
  }

  h1 {
    margin:0 0 10px 0;
    font-size:26px;
  }

  h2 {
    margin:0 0 30px 0;
    font-weight:400;
    color:#666;
  }

  .grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
  }

  .box {
    padding:20px;
    border-radius:14px;
    border:1px solid #e6e6e6;
  }

  .num {
    font-size:52px;
    font-weight:700;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }

  .label {
    margin-top:6px;
    font-size:13px;
    letter-spacing:1px;
    color:#777;
    text-transform:uppercase;
  }
</style>
</head>

<body>

<div class="card">
  <h1>Countdown to IU Football Season Opener</h1>
  <h2>September 5, 2026 — 12:00 PM (Bloomington, IN)</h2>

  <div class="grid">
    <div class="box">
      <div id="days" class="num">--</div>
      <div class="label">Days</div>
    </div>
    <div class="box">
      <div id="hours" class="num">--</div>
      <div class="label">Hours</div>
    </div>
    <div class="box">
      <div id="minutes" class="num">--</div>
      <div class="label">Minutes</div>
    </div>
    <div class="box">
      <div id="seconds" class="num">--</div>
      <div class="label">Seconds</div>
    </div>
  </div>
</div>

<script>
  const target = new Date("2026-09-05T12:00:00-04:00"); // Noon Eastern

  function updateCountdown() {
    const now = new Date();
    let diff = Math.floor((target - now) / 1000);

    if (diff <= 0) {
      document.getElementById("days").textContent = "0";
      document.getElementById("hours").textContent = "00";
      document.getElementById("minutes").textContent = "00";
      document.getElementById("seconds").textContent = "00";
      return;
    }

    const days = Math.floor(diff / 86400);
    diff %= 86400;

    const hours = Math.floor(diff / 3600);
    diff %= 3600;

    const minutes = Math.floor(diff / 60);
    const seconds = diff % 60;

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = String(hours).padStart(2,"0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2,"0");
    document.getElementById("seconds").textContent = String(seconds).padStart(2,"0");
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
