<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indiana vs North Texas Countdown</title>

<style>
  body {
    margin:0;
    background:#990000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
  }

  .card {
    background:rgba(0,0,0,0.25);
    padding:50px;
    border-radius:20px;
    text-align:center;
    width:900px;
    max-width:95%;
  }

  h1 {
    margin:0 0 6px 0;
    font-size:34px;
  }

  h2 {
    margin:0 0 12px 0;
    font-weight:500;
    opacity:.95;
  }

  h3 {
    margin:0 0 40px 0;
    font-weight:400;
    opacity:.85;
  }

  .grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:25px;
  }

  .box {
    padding:30px;
    border-radius:14px;
    background:rgba(255,255,255,0.15);
  }

  .num {
    font-size:64px;
    font-weight:700;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }

  .label {
    margin-top:10px;
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
  }

  footer {
    margin-top:40px;
    font-size:13px;
    opacity:.8;
  }
</style>
</head>

<body>

<div class="card">
  <h1>Indiana vs North Texas</h1>
  <h2>Season Opener Countdown</h2>
  <h3>September 5, 2026 — 12:00 PM ET</h3>

  <div class="grid">
    <div class="box"><div id="days" class="num">--</div><div class="label">Days</div></div>
    <div class="box"><div id="hours" class="num">--</div><div class="label">Hours</div></div>
    <div class="box"><div id="minutes" class="num">--</div><div class="label">Minutes</div></div>
    <div class="box"><div id="seconds" class="num">--</div><div class="label">Seconds</div></div>
  </div>

  <footer>
    Memorial Stadium — Bloomington, Indiana (Eastern Time)
  </footer>
</div>

<script>
  const target = new Date("2026-09-05T12:00:00-04:00");

  function updateCountdown() {
    const now = new Date();
    let diff = Math.floor((target - now) / 1000);

    if (diff <= 0) diff = 0;

    const days = Math.floor(diff / 86400);
    diff %= 86400;

    const hours = Math.floor(diff / 3600);
    diff %= 3600;

    const minutes = Math.floor(diff / 60);
    const seconds = diff % 60;

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = String(hours).padStart(2,"0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2,"0");
    document.getElementById("seconds").textContent = String(seconds).padStart(2,"0");
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
